[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "case-analysis-engine"
version = "0.1.0"
description = "Evidence-first deterministic analysis of extracted case facts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1,<9.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0", "ruff>=0.5"]

[project.scripts]
case-analysis = "case_analysis_engine.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
