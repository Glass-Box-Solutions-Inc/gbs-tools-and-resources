# wc-caseload doctrine showcase — all fifteen landmark doctrines, every one supported.
#
#   wc-caseload generate --spec examples/doctrine-showcase.yaml --out /tmp/wcce-doctrine
#   wc-caseload validate --out /tmp/wcce-doctrine
#
# The demo caseload (examples/demo-caseload.yaml) deliberately carries two
# doctrine hooks their cases cannot support, to exercise the kept-and-warned
# path. This spec is the opposite exercise: seven cases whose facts satisfy every
# hook's prerequisite, so a full run emits **zero** doctrine warnings.
#
# Each case is grouped by what its doctrines need, which is also the fastest way
# to read the prerequisite rules:
#
#   1. rating-doctrines   eval_type: qme + two body parts  -> ogilvie, almaraz_guzman,
#                                                              benson, escobedo, kite,
#                                                              sibtf, lc4664_prior_award
#   2. threshold-defence  claim_response: denied            -> going_and_coming, ab5_dynamex
#   3. death-benefits     injury.type: death                -> death_dependency
#   4. psychiatric        psyche in body_parts              -> lc3208_3_psych, gfpa
#   5. safety-member      employer.industry: government     -> firefighter_presumption
#   6. imr-challenge      ur_dispute.enabled + imr: true    -> imr_constitutionality
#   7. treatment-result   medical_history + eval_type: qme  -> hikida_treatment_carveout
#
# There is deliberately not a single `documents.overrides` entry in this file.
# Each case's own lifecycle emits at least one target document for every hook it
# carries, so the doctrine language lands through the natural document plan
# rather than through a forced subtype — which is also why the run is warning
# free end to end (a forced subtype the lifecycle would not have emitted is
# itself a WARN, by design). Grep the generated PDFs for the markers listed in
# docs/user-guide/index.html to confirm the content arrived.
#
# @Developed & Documented by Glass Box Solutions, Inc. using human ingenuity and modern technology

caseload_id: doctrine-showcase

defaults:
  documents:
    format_mix: {pdf: 1.0}
  output:
    filename_style: neutral
    formats: [pdf]

cases:
  # 1. The rating doctrines. A permanent-disability rating exists (eval_type:
  #    qme) and two regions are impaired, which is what benson and kite need on
  #    top of the rating the other five require.
  - case_id: showcase-rating-doctrines
    rng_seed: 360001
    profile:
      applicant: {name: Elena Marchetti, age: 49, occupation: Warehouse Selector, tenure_years: 9.0}
      employer: {name: Rivergate Distribution Partners, industry: warehouse_logistics, county: Alameda}
      carrier: {name: Thornbury Compensation Insurance Company}
    injury:
      type: specific
      date_of_injury: 2022-04-11
      mechanism: struck by a falling pallet while selecting stock
      body_parts:
        - {part: lumbar_spine, icd10: M54.5, detail: L4-L5 disc protrusion}
        - {part: shoulder, icd10: M75.100, detail: left rotator cuff tear}
    lifecycle:
      target_stage: post_recon
      claim_response: accepted
      eval_type: qme
      resolution: {type: findings_award}
      reconsideration:
        enabled: true
        outcome: denied
        post_recon: affirmed_final
      doctrine_hooks:
        [ogilvie, almaraz_guzman, benson, escobedo, kite, sibtf, lc4664_prior_award]
    documents:
      global_cap: 60

  # 2. Threshold defences to compensability. Both hooks answer "is this claim
  #    compensable at all", which presupposes someone said no.
  - case_id: showcase-threshold-defences
    rng_seed: 360002
    profile:
      applicant: {name: Desmond Okonkwo, age: 37, occupation: Route Courier, tenure_years: 2.0}
      employer: {name: Baywater Courier Network, industry: warehouse_logistics, county: Santa Clara}
      carrier: {name: Ashgrove Indemnity Company}
    injury:
      type: specific
      date_of_injury: 2022-08-02
      mechanism: collision while driving between the last delivery of a shift and home
      body_parts:
        - {part: cervical_spine, icd10: M54.2, detail: C5-C6 disc bulge}
    lifecycle:
      target_stage: discovery
      claim_response: denied
      eval_type: qme
      resolution: {type: pending}
      doctrine_hooks: [going_and_coming, ab5_dynamex]
    documents:
      global_cap: 30

  # 3. Death benefits and dependency.
  - case_id: showcase-death-dependency
    rng_seed: 360003
    profile:
      applicant: {name: Arturo Benavides, age: 45, occupation: Steel Erector, tenure_years: 16.0}
      employer: {name: Ironvale Structural Contractors, industry: construction, county: Kern}
      carrier: {name: Coldbrook Casualty Insurance Company}
    injury:
      type: death
      date_of_injury: 2022-06-15
      mechanism: fatal fall from an unguarded steel deck
      body_parts:
        - {part: head, icd10: S06.0X0A, detail: fatal traumatic brain injury}
    lifecycle:
      target_stage: resolved
      claim_response: accepted
      eval_type: none
      resolution: {type: stipulations}
      doctrine_hooks: [death_dependency]
    documents:
      global_cap: 30

  # 4. The psychiatric pair. `psyche` in body_parts is what makes a psychiatric
  #    threshold argument — and a defence to one — coherent.
  - case_id: showcase-psychiatric
    rng_seed: 360004
    profile:
      applicant: {name: Priya Raghunathan, age: 41, occupation: Claims Processor, tenure_years: 7.5}
      employer: {name: Halloway Administrative Services, industry: retail_service, county: Sacramento}
      carrier: {name: Windermere Compensation Insurance Company}
    injury:
      type: cumulative_trauma
      ct_start: 2021-01-04
      ct_end: 2022-09-30
      mechanism: sustained workload escalation and a contested performance review sequence
      body_parts:
        - {part: psyche, icd10: F43.10, detail: post-traumatic stress}
    lifecycle:
      target_stage: medical_legal
      claim_response: delayed
      eval_type: qme
      resolution: {type: pending}
      doctrine_hooks: [lc3208_3_psych, gfpa]
    documents:
      global_cap: 30

  # 5. The safety-member cancer presumption. `industry: government` is what the
  #    prerequisite reads; a qualifying occupation string works too.
  - case_id: showcase-firefighter-presumption
    rng_seed: 360005
    profile:
      applicant: {name: Curtis Almond, age: 53, occupation: Fire Captain, tenure_years: 24.0}
      employer: {name: Verdant Ridge Fire Protection District, industry: government, county: Placer}
      carrier: {name: Stonemere Public Entity Indemnity}
    injury:
      type: cumulative_trauma
      ct_start: 2000-03-01
      ct_end: 2022-05-20
      mechanism: repeated fireground exposure to products of combustion over a full career
      body_parts:
        - {part: internal, icd10: C34.90, detail: malignancy claimed under the LC 3212.1 presumption}
    lifecycle:
      target_stage: discovery
      claim_response: denied
      eval_type: qme
      resolution: {type: pending}
      doctrine_hooks: [firefighter_presumption]
    documents:
      global_cap: 30

  # 6. The IMR due-process challenge. The prerequisite reads ur_dispute.enabled
  #    AND ur_dispute.imr — a UR denial alone is not an IMR.
  - case_id: showcase-imr-challenge
    rng_seed: 360006
    profile:
      applicant: {name: Marcus Delacroix, age: 44, occupation: Millwright, tenure_years: 12.0}
      employer: {name: Cadence Valley Manufacturing, industry: manufacturing, county: San Joaquin}
      carrier: {name: Pellingham Indemnity Company}
    injury:
      type: specific
      date_of_injury: 2022-02-14
      mechanism: crush injury while clearing a jammed conveyor
      body_parts:
        - {part: knee, icd10: M23.51, detail: right medial meniscus tear}
    lifecycle:
      target_stage: medical_legal
      claim_response: accepted
      eval_type: qme
      ur_dispute:
        enabled: true
        decision: upheld
        imr: true
        imr_outcome: upheld
      resolution: {type: pending}
      doctrine_hooks: [imr_constitutionality]
    documents:
      global_cap: 30

  # 7. The Hikida treatment-result carveout, narrowed by Justice. A QME rating
  #    supports the doctrine hook, while the M3-gated history states both the
  #    industrial treatment consequence and the nonindustrial contributor that
  #    makes multifactorial causation — and therefore apportionment — coherent.
  - case_id: showcase-hikida-justice
    rng_seed: 622101
    profile:
      applicant: {name: Nadia Serrano, age: 46, occupation: Surgical Supply Technician, tenure_years: 8.0}
      employer: {name: Lindenmere Clinical Logistics, industry: healthcare, county: Contra Costa}
      carrier: {name: Hawthorne Vale Compensation Insurance Company}
    injury:
      type: specific
      date_of_injury: 2022-03-16
      mechanism: acute lumbar strain while transferring a loaded surgical supply cart
      body_parts:
        - {part: lumbar_spine, icd10: M54.5, detail: lumbar strain followed by decompression surgery}
    lifecycle:
      target_stage: medical_legal
      claim_response: accepted
      eval_type: qme
      resolution: {type: pending}
      doctrine_hooks: [hikida_treatment_carveout]
    scenario:
      surgery: performed
      medical_history:
        sample_conditions: false
        conditions:
          - label: preexisting lumbar degenerative disc disease
            body_part: lumbar_spine
            icd10: M51.36
            origin: nonindustrial
            severity: moderate
            trajectory: progressive
            symptomatic_before_doi: true
          - label: post-surgical complex regional pain syndrome
            body_part: lumbar_spine
            icd10: G90.50
            origin: industrial
            onset: 2022-08-01
            severity: severe
            trajectory: fluctuating
            symptomatic_before_doi: false
    documents:
      global_cap: 30
