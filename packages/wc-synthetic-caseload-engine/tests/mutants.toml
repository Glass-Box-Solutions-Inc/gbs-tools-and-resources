# Mutation registry — one entry per defect this package has fixed.
#
# Each entry names the edit that puts the defect back and the test that must go
# red when it does. `tools/mutation_gate.py` applies every one of them on every
# push. The registry is the acceptance record for eleven rounds of review: a
# fix is not claimed here until its own mutation has been shown to redden a
# test that names it.
#
# Adding a fix means adding a mutant. Changing code under one means re-pointing
# its mutant at the surviving logic — a PATCH-MISS is a finding, not a chore,
# because it means a guard stopped reaching the thing it guards.
#
# Fields:
#   id       stable handle, `m<round>-<n>`
#   title    the defect, stated as the thing that goes wrong when it is back
#   file     path relative to the package root
#   find     text to replace — must appear exactly once
#   replace  the reintroduced defect
#   test     the guard, as a pytest node id

# Retired mutants. A mutant is only ever removed when the *fix* it guards has
# been withdrawn — never because it stopped applying, which is a finding. Each
# retirement names its successor so the claim is still guarded by something.
#
#   m9-4   "the award stops being a multiple of twenty, so the fee lies again"
#   m10-2  "a gross off the twenty-dollar step is accepted again"
#   m10-3  "a derived gross leaves the twenty-dollar step"
#
# All three guarded the twenty-dollar lattice on `gross_amount`, withdrawn in
# round 11 on review's judgment that narrowing a published field to work around
# a renderer's rounding makes the corpus unrealistic in a figure the analyzer is
# scored on. The claim they existed to protect — that the printed fee really is
# fifteen percent — is now guarded by m11-3, which truncates the fee instead.

