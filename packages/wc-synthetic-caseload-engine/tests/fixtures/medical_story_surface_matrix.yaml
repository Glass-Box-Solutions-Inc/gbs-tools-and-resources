# AJC-62 (M3) — the frozen R8 surface x AJC-65 state matrix (R67, R77 step 7).
#
# Exactly seven cases, seeds 620101-620107, everything explicit: conditions,
# assertions and contention documents are all authored and every sampler is
# off, so each case is byte-decided by its own text. Collectively the seven
# cases cover every governed R8 member, both objection and
# supplemental-request surfaces, the QME/AME deposition, and all six AJC-65
# apportionment shapes (none / single / equal-plural / heterogeneous-plural /
# unable-to-approximate / deferred). Interim opinions defer rather than omit
# and final opinions never defer — the §C validator holds both lines.
#
# surface-psych-medlegal (620102) exercises the R81 psych section ORDER with
# the current generic content; the full psych register (P5 phrase pools,
# Hikida/SIBTF/IMR structure) lands at R77 steps 8 and 10 and is deliberately
# absent here.
#
# @Developed & Documented by Glass Box Solutions, Inc. using human ingenuity and modern technology

caseload_id: medical-story-surface-matrix

defaults:
  injury:
    type: specific
    date_of_injury: 2024-03-01
    body_parts:
      - {part: lumbar_spine}
      - {part: shoulder}
  lifecycle:
    target_stage: medical_legal
    claim_response: accepted
    eval_type: qme

cases:
  # R8 initial med-legal family on one QME file: the default interim carrier,
  # the default final carrier, and both explicit initial-family overrides.
  # AJC-65 states: none / single / heterogeneous-plural / unable.
  - case_id: surface-initial-medlegal
    rng_seed: 620101
    scenario:
      medical_history:
        sample_conditions: false
        conditions:
          - label: multilevel degenerative disc disease of the lumbar spine
            origin: mixed
            body_part: lumbar_spine
            severity: moderate
            trajectory: progressive
            symptomatic_before_doi: true
          - label: chronic rotator cuff tendinosis
            origin: nonindustrial
            body_part: shoulder
            severity: mild
            trajectory: stable
            symptomatic_before_doi: false
        prior_claims:
          - body_parts: [lumbar_spine]
            date_of_injury: 2018-05-14
            resolution_type: stipulated_award
            resolution_date: 2019-08-02
            award:
              body_parts: [lumbar_spine]
              pd_percent: 12
              award_date: 2019-08-02
              resolution_type: stipulated_award
      medical_assertions:
        sample_assertions: false
        sample_contention_documents: false
        medical_opinions:
          - id: opn-01
            author_role: qme
            report_stage: interim
            report_date: 2024-09-10
            apportionment_state: determined
            determination_kind: no_nonindustrial_share
            determination_rationale: >-
              The entire permanent disability is caused by the industrial
              injury of March 1, 2024. The pre-existing degenerative changes
              were asymptomatic and non-disabling before the injury and there
              is no medical evidence that they cause any portion of the
              current disability.
            examination_performed: true
            reviewed_condition_ids: [cond-00]
            aoe_coe_finding: industrial
            aoe_coe_rationale: >-
              The mechanism of injury, the temporal onset of symptoms, and
              the treatment course establish within reasonable medical
              probability that the condition arose out of and in the course
              of employment.
            rationale: the conclusions rest on the examination and the record reviewed
          - id: opn-02
            author_role: qme
            report_stage: final
            report_date: 2024-10-20
            apportionment_state: determined
            determination_kind: allocated
            examination_performed: true
            reviewed_condition_ids: [cond-00, cond-01]
            reviewed_prior_claim_ids: [prior-00]
            reviewed_prior_award_ids: [prior-00-award]
            aoe_coe_finding: industrial
            aoe_coe_rationale: >-
              Industrial causation is established by the contemporaneous
              onset of symptoms with the lifting incident and the absence of
              any intervening nonindustrial event.
            rationale: the conclusions rest on the examination and the record reviewed
          - id: opn-03
            author_role: qme
            report_stage: final
            report_date: 2024-11-25
            apportionment_state: determined
            determination_kind: allocated
            examination_performed: true
            reviewed_condition_ids: [cond-00, cond-01]
            aoe_coe_finding: industrial
            aoe_coe_rationale: >-
              Each claimed body part shows an injury pattern consistent with
              the reported mechanism, and the condition arose out of and in
              the course of employment.
            rationale: the conclusions rest on the examination and the record reviewed
          - id: opn-04
            author_role: qme
            report_stage: final
            report_date: 2024-12-30
            apportionment_state: determined
            determination_kind: unable_to_approximate
            determination_rationale: >-
              The relative contributions of the industrial injury and the
              pre-existing degenerative disease cannot be approximated on
              this record within reasonable medical probability, and no
              percentage allocation is stated.
            examination_performed: true
            reviewed_condition_ids: [cond-00]
            aoe_coe_finding: industrial
            aoe_coe_rationale: >-
              The injury arose out of and in the course of employment based
              on the history, the records, and the examination.
            rationale: the conclusions rest on the examination and the record reviewed
        apportionment_assertions:
          - id: app-01
            opinion_id: opn-02
            body_part: lumbar_spine
            industrial_percent: 75
            nonindustrial_percent: 25
            basis_kinds: [preexisting_degenerative_pathology]
            condition_ids: [cond-00]
            reasonable_medical_probability: true
            causal_rationale: >-
              The multilevel degenerative disc disease predated the injury,
              was symptomatic, and continues to cause a portion of the
              current permanent disability.
            percentage_rationale: >-
              The allocation rests on the imaging severity, the pre-injury
              symptom history, and the prior award affecting the same region.
          - id: app-02
            opinion_id: opn-03
            body_part: lumbar_spine
            industrial_percent: 70
            nonindustrial_percent: 30
            basis_kinds: [preexisting_degenerative_pathology]
            condition_ids: [cond-00]
            reasonable_medical_probability: true
            causal_rationale: >-
              The degenerative disease is an independent cause of lumbar
              disability operating now.
          - id: app-03
            opinion_id: opn-03
            body_part: shoulder
            industrial_percent: 90
            nonindustrial_percent: 10
            basis_kinds: [asymptomatic_prior_condition]
            condition_ids: [cond-01]
            reasonable_medical_probability: true
            causal_rationale: >-
              The previously asymptomatic rotator cuff tendinosis makes a
              small but medically probable contribution to the shoulder
              disability.
        contention_documents:
          - id: cdoc-01
            document_kind: opinion_report
            medical_opinion_id: opn-03
            subtype: APPORTIONMENT_REPORT
          - id: cdoc-02
            document_kind: opinion_report
            medical_opinion_id: opn-04
            subtype: MEDICAL_LEGAL_QME_AME_IME

  # The psych med-legal surface: four speaking opinions exercise the direct,
  # GFPA, consequence, and structured safety-officer registers. The GFPA
  # opinion authors the R84 45/30/25 injury-causation allocation beside an
  # independent 70/30 permanent-disability apportionment row.
  - case_id: surface-psych-medlegal
    rng_seed: 620102
    profile:
      applicant:
        occupation: Firefighter
        tenure_years: 0.25
      employer:
        industry: government
      physicians:
        qme_specialty: Psychiatry
    injury:
      type: specific
      date_of_injury: 2024-03-01
      body_parts:
        - {part: lumbar_spine}
        - {part: psyche}
    scenario:
      medical_history:
        sample_conditions: false
        conditions:
          - label: adjustment disorder with mixed anxiety and depressed mood
            body_system: psychiatric
            origin: mixed
            body_part: psyche
            severity: moderate
            trajectory: fluctuating
            symptomatic_before_doi: false
          - label: multilevel degenerative disc disease of the lumbar spine
            origin: mixed
            body_part: lumbar_spine
            severity: moderate
            trajectory: progressive
            symptomatic_before_doi: true
          - label: post-traumatic stress disorder
            body_system: psychiatric
            origin: industrial
            body_part: psyche
            icd10: F43.10
            severity: moderate
            trajectory: fluctuating
            symptomatic_before_doi: false
      medical_assertions:
        sample_assertions: false
        sample_contention_documents: false
        contentions:
          - id: ctn-01
            claim_type: psych_add_on
            party: applicant
            target_body_part: psyche
            psych_injury_kind: direct
            rationale: >-
              The psychiatric condition arose directly from the industrial
              employment event and is compensable in its own right.
          - id: ctn-02
            claim_type: psych_add_on
            party: applicant
            target_condition_id: cond-00
            target_body_part: psyche
            doctrine_hooks: [gfpa]
            psych_injury_kind: direct
            rationale: >-
              The applicant reports harassment, humiliation, a hostile work
              environment, a performance evaluation, progressive discipline,
              termination, reported mistreatment, and reported discrimination.
          - id: ctn-03
            claim_type: psych_add_on
            party: applicant
            target_condition_id: cond-00
            target_body_part: psyche
            psych_injury_kind: compensable_consequence
            rationale: >-
              The psychiatric condition followed chronic pain, disability,
              treatment, sleep disruption, and loss of function after the
              industrial physical injury.
          - id: ctn-04
            claim_type: psych_add_on
            party: applicant
            target_condition_id: cond-02
            target_body_part: psyche
            psych_injury_kind: direct
            rationale: >-
              PTSD followed a traumatic assault during qualifying service.
        medical_opinions:
          - id: opn-01
            author_role: qme
            report_stage: interim
            report_date: 2024-12-05
            apportionment_state: deferred
            examination_performed: true
            reviewed_condition_ids: [cond-00, cond-01]
            endorses_contention_ids: [ctn-01]
            psych_injury_kind: direct
            aoe_coe_finding: industrial
            aoe_coe_rationale: >-
              The psychiatric injury arose from the industrial event itself
              rather than from the medical consequences of the physical injury,
              and the predominant cause is the actual events of employment.
            rationale: the conclusions rest on the examination and the record reviewed
          - id: opn-02
            author_role: qme
            report_stage: final
            report_date: 2025-01-10
            apportionment_state: determined
            determination_kind: allocated
            examination_performed: true
            reviewed_condition_ids: [cond-00, cond-01]
            endorses_contention_ids: [ctn-02]
            psych_injury_kind: direct
            aoe_coe_finding: industrial
            aoe_coe_rationale: >-
              45% reported harassment/humiliation/hostile-work-environment events;
              30% personnel actions; 25% outside or preexisting factors. The
              report assumes only that the trier of fact finds the performance
              evaluation, progressive discipline, termination, reported
              mistreatment, and reported discrimination occurred.
            rationale: the conclusions rest on the examination and the record reviewed
          - id: opn-03
            author_role: qme
            report_stage: final
            report_date: 2025-02-14
            apportionment_state: determined
            determination_kind: allocated
            examination_performed: true
            reviewed_condition_ids: [cond-00, cond-01]
            endorses_contention_ids: [ctn-03]
            psych_injury_kind: compensable_consequence
            aoe_coe_finding: industrial
            aoe_coe_rationale: >-
              Chronic pain, disability, treatment, sleep disruption, and loss
              of function from the industrial physical injury are greater than
              50 percent of all causes combined.
            rationale: the conclusions rest on the examination and the record reviewed
          - id: opn-04
            author_role: qme
            report_stage: final
            report_date: 2025-03-21
            apportionment_state: determined
            determination_kind: no_nonindustrial_share
            determination_rationale: >-
              No nonindustrial cause of permanent disability is established on
              the examination and record reviewed.
            examination_performed: true
            reviewed_condition_ids: [cond-02]
            endorses_contention_ids: [ctn-04]
            psych_injury_kind: direct
            aoe_coe_finding: industrial
            aoe_coe_rationale: >-
              Post-traumatic stress disorder followed a traumatic assault during
              qualifying service as a firefighter.
            rationale: the conclusions rest on the examination and the record reviewed
        apportionment_assertions:
          - id: app-01
            opinion_id: opn-03
            body_part: psyche
            industrial_percent: 90
            nonindustrial_percent: 10
            basis_kinds: [psych_impairment_add_on]
            condition_ids: [cond-00]
            reasonable_medical_probability: true
            causal_rationale: >-
              The physical-injury outcome must be evaluated independently of
              the psychiatric condition.
            percentage_rationale: >-
              The disability allocation rests on the examined psychiatric history.
            psych_exception_analysis: catastrophic_injury
          - id: app-02
            opinion_id: opn-02
            body_part: psyche
            industrial_percent: 70
            nonindustrial_percent: 30
            basis_kinds: [nonindustrial_medical_condition]
            condition_ids: [cond-00]
            reasonable_medical_probability: true
            causal_rationale: >-
              A preexisting psychiatric contribution independently causes part
              of the current permanent disability.
            percentage_rationale: >-
              The 70/30 disability allocation rests on the examination and
              records, independently of injury-causation percentages.
        contention_documents:
          - id: cdoc-01
            document_kind: objection
            actor_party: defense
            target_medical_opinion_id: opn-02
            spoken_contention_ids: [ctn-02]
            defense_contest_theories: [post_termination]
            doc_date: 2025-01-24

